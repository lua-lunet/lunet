name: Build
#
# AppVeyor checks are a FALSE ALARM. Ignore them.
#
# The "continuous-integration/appveyor/pr" and ".../branch" checks that appear
# red on pull requests are not this workflow and are not a real signal. The
# AppVeyor account was deleted before its jobs were removed, so the webhooks
# are orphaned: they report failure without ever building anything, and there
# is no account left to switch them off. Clearing them needs a repo deepclean
# (or a recreate), which is deferred until closer to 1.0.0.
#
# They are deliberately excluded from the required status checks on main. The
# GitHub Actions jobs below are the only build signal that counts.
#
# This is also documented in the release quality gate in AGENTS.md.

on:
  push:
    branches: [ main, xmake ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build'
        required: false
        default: ''
      targets:
        description: 'Comma-separated targets to build (empty = all): linux-amd64, linux-arm64, macos, windows'
        required: false
        default: ''

permissions:
  contents: write

# Cancel previous runs when a new commit is pushed to the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  setup-matrix:
    name: Setup build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          TARGETS="${{ github.event.inputs.targets }}"
          # Full matrix definition (compact JSON for GitHub Actions output)
          ALL='{"include":[{"os":"ubuntu-latest","arch":"amd64","platform":"linux","target_key":"linux-amd64"},{"os":"blacksmith-4vcpu-ubuntu-2404-arm","arch":"arm64","platform":"linux","target_key":"linux-arm64"},{"os":"macos-latest","arch":"arm64","platform":"macos","target_key":"macos"},{"os":"blacksmith-4vcpu-windows-2025","arch":"amd64","platform":"windows","target_key":"windows"}]}'
          if [ -z "$TARGETS" ]; then
            echo "matrix=$ALL" >> "$GITHUB_OUTPUT"
          else
            # Filter matrix entries based on targets (comma-separated)
            FILTERED='{"include":['
            FIRST=true
            IFS=',' read -ra TARGET_LIST <<< "$TARGETS"
            for target in "${TARGET_LIST[@]}"; do
              target=$(echo "$target" | xargs)  # trim whitespace
              case "$target" in
                linux-amd64)
                  ENTRY='{"os":"ubuntu-latest","arch":"amd64","platform":"linux","target_key":"linux-amd64"}'
                  ;;
                linux-arm64)
                  ENTRY='{"os":"blacksmith-4vcpu-ubuntu-2404-arm","arch":"arm64","platform":"linux","target_key":"linux-arm64"}'
                  ;;
                macos)
                  ENTRY='{"os":"macos-latest","arch":"arm64","platform":"macos","target_key":"macos"}'
                  ;;
                windows)
                  ENTRY='{"os":"blacksmith-4vcpu-windows-2025","arch":"amd64","platform":"windows","target_key":"windows"}'
                  ;;
                *)
                  echo "Unknown target: $target" >&2
                  continue
                  ;;
              esac
              if [ "$FIRST" = true ]; then
                FILTERED="$FILTERED$ENTRY"
                FIRST=false
              else
                FILTERED="$FILTERED,$ENTRY"
              fi
            done
            FILTERED="$FILTERED]}"
            echo "matrix=$FILTERED" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.os }}
    needs: setup-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          vcpkg/installed
          vcpkg/packages
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('xmake.lua') }}-${{ hashFiles('vcpkg.json', 'ports/*/vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Install xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: "3.0.8"

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: bash contributing/deps/debian.sh --ci

    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        bash contributing/deps/macos.sh
        echo "PKG_CONFIG_PATH=$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig:$(brew --prefix libpq)/lib/pkgconfig:$(brew --prefix mysql-client)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

    - name: Setup vcpkg (Windows)
      if: runner.os == 'Windows'
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '66c0373dc7fca549e5803087b9487edfe3aca0a1'
      env:
        VCPKG_BINARY_SOURCES: 'clear;nuget,readwrite'

    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: pwsh contributing/deps/windows.ps1

    - name: Configure (Unix)
      if: runner.os != 'Windows'
      run: xmake f -m release -y

    - name: Configure (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $env:VCPKG_ROOT = "${{ github.workspace }}/vcpkg"
        $env:VCPKG_DEFAULT_TRIPLET = "x64-windows"
        $env:CL = "/MP"
        $env:CI = "true"
        xmake f -m release -y

    - name: Build (Unix)
      if: runner.os != 'Windows'
      run: |
        xmake build
        xmake build lunet-static
        xmake build sdk-api-test
        xmake build lunet-sqlite3
        xmake build lunet-httpc
        xmake build lunet-postgres
        xmake build lunet-mysql

    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        xmake build
        xmake build lunet-static
        xmake build sdk-api-test
        xmake build lunet-sqlite3
        xmake build lunet-httpc
        xmake build lunet-postgres
        xmake build lunet-mysql

    - name: C SDK lifecycle test (Unix)
      if: runner.os != 'Windows'
      run: |
        SDK_API_TEST=$(find build -type f -name sdk-api-test | head -n 1)
        if [ -z "$SDK_API_TEST" ]; then echo "sdk-api-test not found" >&2; exit 1; fi
        if command -v gtimeout &>/dev/null; then TMO=gtimeout; else TMO=timeout; fi
        $TMO 10 "$SDK_API_TEST"

    - name: C SDK lifecycle test (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $test = Get-ChildItem -Path build -Recurse -Filter "sdk-api-test.exe" | Select-Object -First 1
        if (-not $test) { throw "sdk-api-test.exe not found" }
        & $test.FullName
        if ($LASTEXITCODE -ne 0) { throw "sdk-api-test failed" }

    # Rust ext modules (lnt_shared, jsonic) — built on Unix only:
    # lnt_shared is POSIX-only by design (mmap/clock_gettime), and the
    # jsonic Lua loader has no .dll suffix handling yet.  See #115.
    - name: Setup Rust toolchain (Unix)
      if: runner.os != 'Windows'
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo artifacts (Unix)
      if: runner.os != 'Windows'
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ runner.os }}-rust-ext

    - name: Build Rust ext modules (Unix)
      if: runner.os != 'Windows'
      run: |
        set -euo pipefail
        cargo build --release --manifest-path ext/lnt_shared/Cargo.toml
        cargo build --release --manifest-path ext/jsonic/Cargo.toml

    # On Linux, sodium-src.sh installs a source-built libsodium (1.0.22)
    # to /tmp/libsodium so the PAXE cdylib gets AES-256-GCM on ARM64
    # (libsodium <1.0.20 lacks ARM Crypto Extensions support, and 1.0.21
    # does not compile on aarch64 with GCC). macOS gets
    # Homebrew 1.0.22; Windows gets vcpkg's current version. The env var
    # is build.rs's priority-1 path (see ext/paxe/build.rs:70).
    - name: Set PAXE libsodium path (Linux)
      if: runner.os == 'Linux'
      run: echo "PAXE_SODIUM_LIB_DIR=/tmp/libsodium/lib" >> "$GITHUB_ENV"

    # PAXE Rust scaffold (ext/paxe): zero-dependency cdylib. The
    # three-platform claim is tested here, not asserted — this step runs on
    # Windows too, unlike the ext modules above. Cargo is preinstalled on
    # the GH runners; ext/paxe/rust-toolchain.toml pins the toolchain and
    # rustup auto-installs the pinned version on first use. Cargo must run
    # with ext/paxe as the working directory: rustup resolves
    # rust-toolchain.toml from the cwd, not from --manifest-path.
    - name: Build PAXE Rust crate
      working-directory: ext/paxe
      run: cargo build --release

    # The crate's test suite (including the known-answer vectors, the primary
    # defence against a wrong wire format) runs here — after the toolchain and
    # dependencies are in place, before the artefact is verified — so a test
    # failure stops the job before a bad cdylib is packaged. Same
    # working-directory requirement as the build step above (rustup resolves
    # rust-toolchain.toml from the cwd).
    - name: Test PAXE Rust crate
      working-directory: ext/paxe
      run: cargo test

    # Windows cdylib naming differs from Unix (.dll, no "lib" prefix), so
    # confirm the artefact under the expected per-platform name rather than
    # assuming it.
    - name: Verify PAXE cdylib artefact
      shell: bash
      run: |
        set -euo pipefail
        case "${{ runner.os }}" in
          Windows) ART=ext/paxe/target/release/lunet_paxe.dll ;;
          macOS)   ART=ext/paxe/target/release/liblunet_paxe.dylib ;;
          *)       ART=ext/paxe/target/release/liblunet_paxe.so ;;
        esac
        if [ ! -f "$ART" ]; then echo "missing artefact: $ART" >&2; exit 1; fi
        echo "PAXE cdylib OK: $ART"

    - name: Examples compile check (Unix)
      if: runner.os != 'Windows'
      run: |
        LUNET_BIN=$(find build -name 'lunet-run' -type f | head -1)
        "$LUNET_BIN" test/ci_examples_compile.lua

    - name: Examples compile check (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $lunet = Get-ChildItem -Path build -Recurse -Filter "lunet-run.exe" | Select-Object -First 1
        if (-not $lunet) { throw "lunet-run.exe not found" }
        & $lunet.FullName test/ci_examples_compile.lua

    - name: SQLite3 example smoke (Unix)
      if: runner.os != 'Windows'
      run: |
        LUNET_BIN=$(find build -name 'lunet-run' -type f | head -1)
        "$LUNET_BIN" examples/03_db_sqlite3.lua

    - name: SQLite3 example smoke (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $lunet = Get-ChildItem -Path build -Recurse -Filter "lunet-run.exe" | Select-Object -First 1
        if (-not $lunet) { throw "lunet-run.exe not found" }
        & $lunet.FullName examples/03_db_sqlite3.lua

    - name: Package release archive (Linux)
      if: matrix.platform == 'linux'
      run: |
        set -euo pipefail
        DIST_DIR="$(mktemp -d)"
        mkdir -p "$DIST_DIR/lunet"
        cp "$(find build -type f -name 'lunet-run' | head -n 1)" "$DIST_DIR/lunet-run"
        cp "$(find build -type f -name 'lunet.so' | head -n 1)" "$DIST_DIR/lunet.so"
        while IFS= read -r mod; do
          cp "$mod" "$DIST_DIR/lunet/"
        done < <(find build -type f -path '*/lunet/*.so')
        # Rust ext modules (#115): each Lua loader resolves its compiled
        # library relative to its own directory, so co-locate loaders and
        # cdylibs under lunet/.
        cp ext/lnt_shared/lnt_shared.lua "$DIST_DIR/lunet/"
        cp ext/lnt_shared/target/release/liblnt_shared.so "$DIST_DIR/lunet/"
        cp ext/jsonic/jsonic.lua ext/jsonic/dkjson-encode-v2.10.lua "$DIST_DIR/lunet/"
        cp ext/jsonic/target/release/liblunet_jsonic.so "$DIST_DIR/lunet/"
        # DB transaction wrappers (#119): one per driver, deliberately not shared.
        cp ext/sqlite3/sqlite3_tx.lua ext/postgres/postgres_tx.lua \
           ext/mysql/mysql_tx.lua "$DIST_DIR/lunet/"
        tar -C "$DIST_DIR" -czf "lunet-linux-${{ matrix.arch }}.tar.gz" .

    - name: Package release archive (macOS)
      if: runner.os == 'macOS'
      run: |
        set -euo pipefail
        DIST_DIR="$(mktemp -d)"
        mkdir -p "$DIST_DIR/lunet"
        cp "$(find build -type f -name 'lunet-run' | head -n 1)" "$DIST_DIR/lunet-run"
        cp "$(find build -type f -name 'lunet.so' | head -n 1)" "$DIST_DIR/lunet.so"
        while IFS= read -r mod; do
          cp "$mod" "$DIST_DIR/lunet/"
        done < <(find build -type f -path '*/lunet/*.so')
        # Rust ext modules (#115): each Lua loader resolves its compiled
        # library relative to its own directory, so co-locate loaders and
        # cdylibs under lunet/.
        cp ext/lnt_shared/lnt_shared.lua "$DIST_DIR/lunet/"
        cp ext/lnt_shared/target/release/liblnt_shared.dylib "$DIST_DIR/lunet/"
        cp ext/jsonic/jsonic.lua ext/jsonic/dkjson-encode-v2.10.lua "$DIST_DIR/lunet/"
        cp ext/jsonic/target/release/liblunet_jsonic.dylib "$DIST_DIR/lunet/"
        # DB transaction wrappers (#119): one per driver, deliberately not shared.
        cp ext/sqlite3/sqlite3_tx.lua ext/postgres/postgres_tx.lua \
           ext/mysql/mysql_tx.lua "$DIST_DIR/lunet/"
        tar -C "$DIST_DIR" -czf lunet-macos.tar.gz .

    - name: Package release SDK (Linux)
      if: matrix.platform == 'linux'
      run: |
        set -euo pipefail
        SDK_DIR="$(mktemp -d)"
        mkdir -p "$SDK_DIR/bin" "$SDK_DIR/examples/sdk_embed/app" "$SDK_DIR/include" "$SDK_DIR/lib"
        cp "$(find build -type f -name 'liblunet-static.a' | head -n 1)" "$SDK_DIR/lib/liblunet-static.a"
        cp include/lunet.h include/lunet_exports.h "$SDK_DIR/include/"
        cp bin/generate_embed_scripts.lua "$SDK_DIR/bin/"
        cp examples/sdk_embed/main.c "$SDK_DIR/examples/sdk_embed/"
        cp examples/sdk_embed/app/main.lua "$SDK_DIR/examples/sdk_embed/app/"
        cp docs/EMBEDDING.md "$SDK_DIR/README.md"
        cp docs/EMBEDDING-CN.md "$SDK_DIR/README-CN.md"
        cp LICENSE "$SDK_DIR/"
        tar -C "$SDK_DIR" -czf "lunet-linux-${{ matrix.arch }}-sdk.tar.gz" .

    - name: Package release SDK (macOS)
      if: runner.os == 'macOS'
      run: |
        set -euo pipefail
        SDK_DIR="$(mktemp -d)"
        mkdir -p "$SDK_DIR/bin" "$SDK_DIR/examples/sdk_embed/app" "$SDK_DIR/include" "$SDK_DIR/lib"
        cp "$(find build -type f -name 'liblunet-static.a' | head -n 1)" "$SDK_DIR/lib/liblunet-static.a"
        cp include/lunet.h include/lunet_exports.h "$SDK_DIR/include/"
        cp bin/generate_embed_scripts.lua "$SDK_DIR/bin/"
        cp examples/sdk_embed/main.c "$SDK_DIR/examples/sdk_embed/"
        cp examples/sdk_embed/app/main.lua "$SDK_DIR/examples/sdk_embed/app/"
        cp docs/EMBEDDING.md "$SDK_DIR/README.md"
        cp docs/EMBEDDING-CN.md "$SDK_DIR/README-CN.md"
        cp LICENSE "$SDK_DIR/"
        tar -C "$SDK_DIR" -czf lunet-macos-sdk.tar.gz .

    - name: Package release archive (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $dist = Join-Path $env:RUNNER_TEMP ("lunet-dist-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
        New-Item -ItemType Directory -Path (Join-Path $dist "lunet") -Force | Out-Null
        Copy-Item (Get-ChildItem -Path build -Recurse -Filter lunet-run.exe | Select-Object -First 1).FullName (Join-Path $dist "lunet-run.exe")
        Copy-Item (Get-ChildItem -Path build -Recurse -Filter lunet.dll | Select-Object -First 1).FullName (Join-Path $dist "lunet.dll")
        Get-ChildItem -Path build -Recurse -Filter *.dll | Where-Object { $_.FullName -match '\\lunet\\' } | ForEach-Object {
          Copy-Item $_.FullName (Join-Path $dist "lunet")
        }
        # DB transaction wrappers (#119): one per driver, deliberately not shared.
        Copy-Item ext\sqlite3\sqlite3_tx.lua, ext\postgres\postgres_tx.lua, ext\mysql\mysql_tx.lua (Join-Path $dist "lunet")
        Compress-Archive -Path (Join-Path $dist "*") -DestinationPath lunet-windows-amd64.zip -Force

    - name: Package release SDK (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $sdk = Join-Path $env:RUNNER_TEMP ("lunet-sdk-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
        New-Item -ItemType Directory -Path (Join-Path $sdk "bin"), (Join-Path $sdk "examples\sdk_embed\app"), (Join-Path $sdk "include"), (Join-Path $sdk "lib") -Force | Out-Null
        Copy-Item (Get-ChildItem -Path build -Recurse -Filter lunet-static.lib | Select-Object -First 1).FullName (Join-Path $sdk "lib\lunet-static.lib")
        Copy-Item include\lunet.h, include\lunet_exports.h (Join-Path $sdk "include")
        Copy-Item bin\generate_embed_scripts.lua (Join-Path $sdk "bin")
        Copy-Item examples\sdk_embed\main.c (Join-Path $sdk "examples\sdk_embed")
        Copy-Item examples\sdk_embed\app\main.lua (Join-Path $sdk "examples\sdk_embed\app")
        Copy-Item docs\EMBEDDING.md (Join-Path $sdk "README.md")
        Copy-Item docs\EMBEDDING-CN.md (Join-Path $sdk "README-CN.md")
        Copy-Item LICENSE $sdk
        Compress-Archive -Path (Join-Path $sdk "*") -DestinationPath lunet-windows-amd64-sdk.zip -Force

    # Guard against shipping a broken archive: extract the just-built tarball
    # and exercise both Rust ext modules through the packaged binary, using
    # exactly the layout downstream apps will consume (#115).
    - name: Verify packaged ext modules (Unix)
      if: runner.os != 'Windows'
      run: |
        set -euo pipefail
        if [ "${{ matrix.platform }}" = "linux" ]; then
          ARCHIVE="lunet-linux-${{ matrix.arch }}.tar.gz"
        else
          ARCHIVE=lunet-macos.tar.gz
        fi
        VERIFY_DIR="$(mktemp -d)"
        tar -C "$VERIFY_DIR" -xzf "$ARCHIVE"
        cat > "$VERIFY_DIR/verify_ext.lua" <<LUA
        package.path = "$VERIFY_DIR/?.lua;" .. package.path
        local lnt = require("lunet.lnt_shared")
        local store = lnt.store("verify", 256 * 1024)
        assert(store:set("k", "v"))
        assert(store:get("k") == "v")
        local json = require("lunet.jsonic")
        local v = json.decode('{"a":1,"s":"ok"}')
        assert(v.a == 1 and v.s == "ok")
        assert(json.encode({ a = 1 }, { keyorder = { "a" } }) == '{"a":1}')
        print("VERIFY OK: lunet.lnt_shared + lunet.jsonic work from packaged archive")
        LUA
        "$VERIFY_DIR/lunet-run" "$VERIFY_DIR/verify_ext.lua"

    # Keep these steps byte-identical to the documented commands in
    # docs/EMBEDDING.md so CI verifies exactly what users are told to run.
    - name: Verify packaged SDK (Linux)
      if: matrix.platform == 'linux'
      run: |
        set -euo pipefail
        VERIFY_DIR="$(mktemp -d)"
        tar -C "$VERIFY_DIR" -xzf "lunet-linux-${{ matrix.arch }}-sdk.tar.gz"
        (
          cd "$VERIFY_DIR"
          mkdir generated
          LUNET_EMBED_SOURCE=examples/sdk_embed/app \
          LUNET_EMBED_OUTPUT=generated/lunet_embed_scripts_blob.h \
          LUNET_EMBED_PROJECT_ROOT="$VERIFY_DIR" \
          xmake lua bin/generate_embed_scripts.lua
          cc -std=c99 -Iinclude -Igenerated \
            $(pkg-config --cflags luajit libuv zlib) \
            examples/sdk_embed/main.c lib/liblunet-static.a \
            $(pkg-config --libs luajit libuv zlib) -pthread -ldl -lm \
            -o sdk-embedded-app
          timeout 10 ./sdk-embedded-app
        )

    - name: Verify packaged SDK (macOS)
      if: runner.os == 'macOS'
      run: |
        set -euo pipefail
        VERIFY_DIR="$(mktemp -d)"
        tar -C "$VERIFY_DIR" -xzf lunet-macos-sdk.tar.gz
        (
          cd "$VERIFY_DIR"
          mkdir generated
          LUNET_EMBED_SOURCE=examples/sdk_embed/app \
          LUNET_EMBED_OUTPUT=generated/lunet_embed_scripts_blob.h \
          LUNET_EMBED_PROJECT_ROOT="$VERIFY_DIR" \
          xmake lua bin/generate_embed_scripts.lua
          cc -std=c99 -Iinclude -Igenerated \
            $(pkg-config --cflags luajit libuv zlib) \
            examples/sdk_embed/main.c lib/liblunet-static.a \
            $(pkg-config --libs luajit libuv zlib) -o sdk-embedded-app
          if command -v gtimeout &>/dev/null; then TMO=gtimeout; else TMO=timeout; fi
          $TMO 10 ./sdk-embedded-app
        )

    - name: Verify packaged SDK (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $verify = Join-Path $env:RUNNER_TEMP ("lunet-sdk-verify-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
        Expand-Archive -Path lunet-windows-amd64-sdk.zip -DestinationPath $verify -Force
        Push-Location $verify
        try {
          New-Item -ItemType Directory generated | Out-Null
          $env:LUNET_EMBED_SOURCE = "examples\\sdk_embed\\app"
          $env:LUNET_EMBED_OUTPUT = "generated\\lunet_embed_scripts_blob.h"
          $env:LUNET_EMBED_PROJECT_ROOT = $verify
          xmake lua bin\generate_embed_scripts.lua
          if ($LASTEXITCODE -ne 0) { throw "SDK blob generation failed" }
          # /MD is required, not optional: lunet-static.lib is built against the
          # dynamic CRT, so its objects reference __imp_ CRT symbols, and the
          # vcpkg x64-windows triplet is dynamic too. Without /MD, cl defaults to
          # the static CRT and the link dies with LNK2019 on __imp__fullpath,
          # __imp_fopen, __imp_fwrite, __imp_realloc, __imp_strerror and
          # __imp__mkdir (preceded by a wall of LNK4217/LNK4286 "defined in
          # libucrt.lib ... is imported by" warnings, which are the tell).
          cl /nologo /std:c11 /MD /I include /I generated /I "$env:VCPKG_ROOT\installed\x64-windows\include" examples\sdk_embed\main.c lib\lunet-static.lib /link /LIBPATH:"$env:VCPKG_ROOT\installed\x64-windows\lib" lua51.lib uv.lib zlib.lib ws2_32.lib iphlpapi.lib userenv.lib psapi.lib advapi32.lib user32.lib shell32.lib ole32.lib dbghelp.lib /OUT:sdk-embedded-app.exe
          if ($LASTEXITCODE -ne 0) { throw "SDK example compile failed" }
          # /MD plus the dynamic vcpkg triplet means the exe loads lua51.dll,
          # uv.dll and zlib1.dll at runtime. They live in vcpkg's bin, not in
          # the SDK archive, so without this the process dies before main()
          # with STATUS_DLL_NOT_FOUND (0xC0000135) and prints nothing at all.
          $env:PATH = "$env:VCPKG_ROOT\installed\x64-windows\bin;$env:PATH"
          & .\sdk-embedded-app.exe
          $appExit = $LASTEXITCODE
          if ($appExit -ne 0) {
            # Report the code: a bare "execution failed" with no stdout is
            # indistinguishable from a loader failure, which cost a CI cycle.
            throw ("SDK example execution failed (exit code {0} / 0x{1:X8})" -f $appExit, $appExit)
          }
        } finally {
          Pop-Location
        }

    - name: Upload artifact (Linux)
      if: matrix.platform == 'linux'
      uses: actions/upload-artifact@v4
      with:
        name: lunet-linux-${{ matrix.arch }}
        path: |
          build/**/lunet-run
          build/**/lunet.so
