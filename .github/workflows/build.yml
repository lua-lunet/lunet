name: Build
#
# AppVeyor checks are a FALSE ALARM. Ignore them.
#
# The "continuous-integration/appveyor/pr" and ".../branch" checks that appear
# red on pull requests are not this workflow and are not a real signal. The
# AppVeyor account was deleted before its jobs were removed, so the webhooks
# are orphaned: they report failure without ever building anything, and there
# is no account left to switch them off. Clearing them needs a repo deepclean
# (or a recreate), which is deferred until closer to 1.0.0.
#
# They are deliberately excluded from the required status checks on main. The
# GitHub Actions jobs below are the only build signal that counts.
#
# This is also documented in the release quality gate in AGENTS.md.

on:
  push:
    branches: [ main, xmake ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build'
        required: false
        default: ''
      targets:
        description: 'Comma-separated targets to build (empty = all): linux-amd64, linux-arm64, macos, windows'
        required: false
        default: ''

permissions:
  contents: write

# Cancel previous runs when a new commit is pushed to the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  setup-matrix:
    name: Setup build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          TARGETS="${{ github.event.inputs.targets }}"
          # Full matrix definition (compact JSON for GitHub Actions output)
          ALL='{"include":[{"os":"ubuntu-latest","arch":"amd64","platform":"linux","target_key":"linux-amd64"},{"os":"blacksmith-4vcpu-ubuntu-2404-arm","arch":"arm64","platform":"linux","target_key":"linux-arm64"},{"os":"macos-latest","arch":"arm64","platform":"macos","target_key":"macos"},{"os":"blacksmith-4vcpu-windows-2025","arch":"amd64","platform":"windows","target_key":"windows"}]}'
          if [ -z "$TARGETS" ]; then
            echo "matrix=$ALL" >> "$GITHUB_OUTPUT"
          else
            # Filter matrix entries based on targets (comma-separated)
            FILTERED='{"include":['
            FIRST=true
            IFS=',' read -ra TARGET_LIST <<< "$TARGETS"
            for target in "${TARGET_LIST[@]}"; do
              target=$(echo "$target" | xargs)  # trim whitespace
              case "$target" in
                linux-amd64)
                  ENTRY='{"os":"ubuntu-latest","arch":"amd64","platform":"linux","target_key":"linux-amd64"}'
                  ;;
                linux-arm64)
                  ENTRY='{"os":"blacksmith-4vcpu-ubuntu-2404-arm","arch":"arm64","platform":"linux","target_key":"linux-arm64"}'
                  ;;
                macos)
                  ENTRY='{"os":"macos-latest","arch":"arm64","platform":"macos","target_key":"macos"}'
                  ;;
                windows)
                  ENTRY='{"os":"blacksmith-4vcpu-windows-2025","arch":"amd64","platform":"windows","target_key":"windows"}'
                  ;;
                *)
                  echo "Unknown target: $target" >&2
                  continue
                  ;;
              esac
              if [ "$FIRST" = true ]; then
                FILTERED="$FILTERED$ENTRY"
                FIRST=false
              else
                FILTERED="$FILTERED,$ENTRY"
              fi
            done
            FILTERED="$FILTERED]}"
            echo "matrix=$FILTERED" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.os }}
    needs: setup-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          vcpkg/installed
          vcpkg/packages
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('xmake.lua') }}-${{ hashFiles('vcpkg.json', 'ports/*/vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Install xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: "3.0.8"

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: bash contributing/deps/debian.sh --ci

    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        bash contributing/deps/macos.sh
        echo "PKG_CONFIG_PATH=$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig:$(brew --prefix libpq)/lib/pkgconfig:$(brew --prefix mysql-client)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

    - name: Setup vcpkg (Windows)
      if: runner.os == 'Windows'
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '66c0373dc7fca549e5803087b9487edfe3aca0a1'
      env:
        VCPKG_BINARY_SOURCES: 'clear;nuget,readwrite'

    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: pwsh contributing/deps/windows.ps1

    - name: Configure (Unix)
      if: runner.os != 'Windows'
      run: xmake f -m release -y

    - name: Configure (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $env:VCPKG_ROOT = "${{ github.workspace }}/vcpkg"
        $env:VCPKG_DEFAULT_TRIPLET = "x64-windows"
        $env:CL = "/MP"
        $env:CI = "true"
        xmake f -m release -y

    - name: Build (Unix)
      if: runner.os != 'Windows'
      run: |
        xmake build
        xmake build lunet-static
        xmake build sdk-api-test
        xmake build lunet-sqlite3
        xmake build lunet-paxe
        xmake build lunet-httpc
        xmake build lunet-postgres
        xmake build lunet-mysql

    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        xmake build
        xmake build lunet-static
        xmake build sdk-api-test
        xmake build lunet-sqlite3
        xmake build lunet-paxe
        xmake build lunet-httpc
        xmake build lunet-postgres
        xmake build lunet-mysql

    # Run the busted suite in CI — it previously ran nowhere, which is why
    # spec rot stayed invisible for months. `xmake test` = check-types ->
    # build lunet-httpc -> busted, and fails on ANY pending test unless
    # LUNET_ALLOW_PENDING=1 (local escape hatch only). The toolchain,
    # libcurl dev headers and a LuaJIT/5.1-tree busted are already installed
    # in this job by contributing/deps/debian.sh --ci (which execs
    # qa-luarocks.sh). One OS job proves the gate; macOS/Windows coverage
    # is a follow-up.
    - name: Lua test suite (make test)
      if: matrix.os == 'ubuntu-latest'
      run: make test

    - name: Socket regression suite (xmake stress)
      if: matrix.os == 'ubuntu-latest'
      timeout-minutes: 2
      run: xmake stress

    - name: C SDK lifecycle test (Unix)
      if: runner.os != 'Windows'
      run: |
        SDK_API_TEST=$(find build -type f -name sdk-api-test | head -n 1)
        if [ -z "$SDK_API_TEST" ]; then echo "sdk-api-test not found" >&2; exit 1; fi
        if command -v gtimeout &>/dev/null; then TMO=gtimeout; else TMO=timeout; fi
        $TMO 10 "$SDK_API_TEST"

    - name: C SDK lifecycle test (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $test = Get-ChildItem -Path build -Recurse -Filter "sdk-api-test.exe" | Select-Object -First 1
        if (-not $test) { throw "sdk-api-test.exe not found" }
        & $test.FullName
        if ($LASTEXITCODE -ne 0) { throw "sdk-api-test failed" }

    # Rust ext modules (lnt_shared, jsonic) — built on Unix only:
    # lnt_shared is POSIX-only by design (mmap/clock_gettime), and the
    # jsonic Lua loader has no .dll suffix handling yet.
    - name: Setup Rust toolchain (Unix)
      if: runner.os != 'Windows'
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo artifacts (Unix)
      if: runner.os != 'Windows'
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ runner.os }}-rust-ext

    - name: Build Rust ext modules (Unix)
      if: runner.os != 'Windows'
      run: |
        set -euo pipefail
        cargo build --release --manifest-path ext/lnt_shared/Cargo.toml
        cargo build --release --manifest-path ext/jsonic/Cargo.toml

    - name: Examples compile check (Unix)
      if: runner.os != 'Windows'
      run: |
        LUNET_BIN=$(find build -name 'lunet-run' -type f | head -1)
        "$LUNET_BIN" test/ci_examples_compile.lua

    - name: Examples compile check (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $lunet = Get-ChildItem -Path build -Recurse -Filter "lunet-run.exe" | Select-Object -First 1
        if (-not $lunet) { throw "lunet-run.exe not found" }
        & $lunet.FullName test/ci_examples_compile.lua

    - name: SQLite3 example smoke (Unix)
      if: runner.os != 'Windows'
      run: |
        LUNET_BIN=$(find build -name 'lunet-run' -type f | head -1)
        "$LUNET_BIN" examples/03_db_sqlite3.lua

    - name: SQLite3 example smoke (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $lunet = Get-ChildItem -Path build -Recurse -Filter "lunet-run.exe" | Select-Object -First 1
        if (-not $lunet) { throw "lunet-run.exe not found" }
        & $lunet.FullName examples/03_db_sqlite3.lua

    - name: PAXE example smoke (Unix)
      if: runner.os != 'Windows'
      run: |
        set -euo pipefail
        LUNET_BIN=$(find build -name 'lunet-run' -type f | head -1)
        # AES-256-GCM requires hardware crypto extensions (AES-NI on x86,
        # ARMv8 CE on arm64). Check availability before running the example.
        cat > /tmp/check_aes.lua <<'LUA'
        local ok, err = pcall(function()
          local paxe = require("lunet.paxe")
          local init_ok = paxe.init()
          print(init_ok and "AES_SUPPORTED" or "AES_UNSUPPORTED")
        end)
        if not ok then print("AES_UNSUPPORTED") end
        LUA
        RESULT=$("$LUNET_BIN" /tmp/check_aes.lua)
        echo "AES check: $RESULT"
        if echo "$RESULT" | grep -q "AES_SUPPORTED"; then
          "$LUNET_BIN" examples/06_paxe_encryption.lua
        else
          echo "SKIP: AES-256-GCM not available on this hardware"
        fi

    - name: PAXE example smoke (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $lunet = Get-ChildItem -Path build -Recurse -Filter "lunet-run.exe" | Select-Object -First 1
        if (-not $lunet) { throw "lunet-run.exe not found" }
        & $lunet.FullName examples/06_paxe_encryption.lua

    - name: Package release archive (Linux)
      if: matrix.platform == 'linux'
      run: |
        set -euo pipefail
        DIST_DIR="$(mktemp -d)"
        mkdir -p "$DIST_DIR/lunet"
        cp "$(find build -type f -name 'lunet-run' | head -n 1)" "$DIST_DIR/lunet-run"
        cp "$(find build -type f -name 'lunet.so' | head -n 1)" "$DIST_DIR/lunet.so"
        while IFS= read -r mod; do
          cp "$mod" "$DIST_DIR/lunet/"
        done < <(find build -type f -path '*/lunet/*.so')
        # Rust ext modules: each Lua loader resolves its compiled
        # library relative to its own directory, so co-locate loaders and
        # cdylibs under lunet/.
        cp ext/lnt_shared/lnt_shared.lua "$DIST_DIR/lunet/"
        cp ext/lnt_shared/target/release/liblnt_shared.so "$DIST_DIR/lunet/"
        cp ext/jsonic/jsonic.lua ext/jsonic/dkjson-encode-v2.10.lua "$DIST_DIR/lunet/"
        cp ext/jsonic/target/release/liblunet_jsonic.so "$DIST_DIR/lunet/"
        # DB transaction wrappers: one per driver, deliberately not shared.
        cp ext/sqlite3/sqlite3_tx.lua ext/postgres/postgres_tx.lua \
           ext/mysql/mysql_tx.lua "$DIST_DIR/lunet/"
        # Documentation: copy every docs/*.md (and its -CN.md counterpart)
        # into the archive by default, excluding internal-only and
        # maintainer-only docs that are not meant for end users.
        DOC_EXCLUDES=" CONTRIBUTING-INTERNALS.md CONTRIBUTING-INTERNALS-CN.md BADGES.md BADGES-CN.md EASY_MEMORY_REPORT.md EASY_MEMORY_REPORT-CN.md WORKFLOW.md WORKFLOW-CN.md XMAKE_INTEGRATION.md XMAKE_INTEGRATION-CN.md "
        for doc in docs/*.md; do
          base="$(basename "$doc")"
          case "$DOC_EXCLUDES" in
            *" $base "*) continue ;;
          esac
          cp "$doc" "$DIST_DIR/"
        done
        # LuaCATS type annotations
        cp -R types "$DIST_DIR/"
        tar -C "$DIST_DIR" -czf "lunet-linux-${{ matrix.arch }}.tar.gz" .

    - name: Package release archive (macOS)
      if: runner.os == 'macOS'
      run: |
        set -euo pipefail
        DIST_DIR="$(mktemp -d)"
        mkdir -p "$DIST_DIR/lunet"
        cp "$(find build -type f -name 'lunet-run' | head -n 1)" "$DIST_DIR/lunet-run"
        cp "$(find build -type f -name 'lunet.so' | head -n 1)" "$DIST_DIR/lunet.so"
        while IFS= read -r mod; do
          cp "$mod" "$DIST_DIR/lunet/"
        done < <(find build -type f -path '*/lunet/*.so')
        # Rust ext modules: each Lua loader resolves its compiled
        # library relative to its own directory, so co-locate loaders and
        # cdylibs under lunet/.
        cp ext/lnt_shared/lnt_shared.lua "$DIST_DIR/lunet/"
        cp ext/lnt_shared/target/release/liblnt_shared.dylib "$DIST_DIR/lunet/"
        cp ext/jsonic/jsonic.lua ext/jsonic/dkjson-encode-v2.10.lua "$DIST_DIR/lunet/"
        cp ext/jsonic/target/release/liblunet_jsonic.dylib "$DIST_DIR/lunet/"
        # DB transaction wrappers: one per driver, deliberately not shared.
        cp ext/sqlite3/sqlite3_tx.lua ext/postgres/postgres_tx.lua \
           ext/mysql/mysql_tx.lua "$DIST_DIR/lunet/"
        # Documentation: copy every docs/*.md (and its -CN.md counterpart)
        # into the archive by default, excluding internal-only and
        # maintainer-only docs that are not meant for end users.
        DOC_EXCLUDES=" CONTRIBUTING-INTERNALS.md CONTRIBUTING-INTERNALS-CN.md BADGES.md BADGES-CN.md EASY_MEMORY_REPORT.md EASY_MEMORY_REPORT-CN.md WORKFLOW.md WORKFLOW-CN.md XMAKE_INTEGRATION.md XMAKE_INTEGRATION-CN.md "
        for doc in docs/*.md; do
          base="$(basename "$doc")"
          case "$DOC_EXCLUDES" in
            *" $base "*) continue ;;
          esac
          cp "$doc" "$DIST_DIR/"
        done
        # LuaCATS type annotations
        cp -R types "$DIST_DIR/"
        tar -C "$DIST_DIR" -czf lunet-macos.tar.gz .

    - name: Package release SDK (Linux)
      if: matrix.platform == 'linux'
      run: |
        set -euo pipefail
        SDK_DIR="$(mktemp -d)"
        mkdir -p "$SDK_DIR/bin" "$SDK_DIR/examples/sdk_embed/app" "$SDK_DIR/include" "$SDK_DIR/lib"
        cp "$(find build -type f -name 'liblunet-static.a' | head -n 1)" "$SDK_DIR/lib/liblunet-static.a"
        cp include/lunet.h include/lunet_exports.h "$SDK_DIR/include/"
        cp bin/generate_embed_scripts.lua "$SDK_DIR/bin/"
        cp examples/sdk_embed/main.c "$SDK_DIR/examples/sdk_embed/"
        cp examples/sdk_embed/app/main.lua "$SDK_DIR/examples/sdk_embed/app/"
        cp docs/EMBEDDING.md "$SDK_DIR/README.md"
        cp docs/EMBEDDING-CN.md "$SDK_DIR/README-CN.md"
        cp LICENSE "$SDK_DIR/"
        tar -C "$SDK_DIR" -czf "lunet-linux-${{ matrix.arch }}-sdk.tar.gz" .

    - name: Package release SDK (macOS)
      if: runner.os == 'macOS'
      run: |
        set -euo pipefail
        SDK_DIR="$(mktemp -d)"
        mkdir -p "$SDK_DIR/bin" "$SDK_DIR/examples/sdk_embed/app" "$SDK_DIR/include" "$SDK_DIR/lib"
        cp "$(find build -type f -name 'liblunet-static.a' | head -n 1)" "$SDK_DIR/lib/liblunet-static.a"
        cp include/lunet.h include/lunet_exports.h "$SDK_DIR/include/"
        cp bin/generate_embed_scripts.lua "$SDK_DIR/bin/"
        cp examples/sdk_embed/main.c "$SDK_DIR/examples/sdk_embed/"
        cp examples/sdk_embed/app/main.lua "$SDK_DIR/examples/sdk_embed/app/"
        cp docs/EMBEDDING.md "$SDK_DIR/README.md"
        cp docs/EMBEDDING-CN.md "$SDK_DIR/README-CN.md"
        cp LICENSE "$SDK_DIR/"
        tar -C "$SDK_DIR" -czf lunet-macos-sdk.tar.gz .

    - name: Package release archive (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $dist = Join-Path $env:RUNNER_TEMP ("lunet-dist-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
        New-Item -ItemType Directory -Path (Join-Path $dist "lunet") -Force | Out-Null
        Copy-Item (Get-ChildItem -Path build -Recurse -Filter lunet-run.exe | Select-Object -First 1).FullName (Join-Path $dist "lunet-run.exe")
        Copy-Item (Get-ChildItem -Path build -Recurse -Filter lunet.dll | Select-Object -First 1).FullName (Join-Path $dist "lunet.dll")
        Get-ChildItem -Path build -Recurse -Filter *.dll | Where-Object { $_.FullName -match '\\lunet\\' } | ForEach-Object {
          Copy-Item $_.FullName (Join-Path $dist "lunet")
        }
        # DB transaction wrappers: one per driver, deliberately not shared.
        Copy-Item ext\sqlite3\sqlite3_tx.lua, ext\postgres\postgres_tx.lua, ext\mysql\mysql_tx.lua (Join-Path $dist "lunet")
        # Documentation: copy every docs\*.md (and its -CN.md counterpart)
        # into the archive by default, excluding internal-only and
        # maintainer-only docs that are not meant for end users.
        $DocExcludes = @("CONTRIBUTING-INTERNALS.md", "CONTRIBUTING-INTERNALS-CN.md", "BADGES.md", "BADGES-CN.md", "EASY_MEMORY_REPORT.md", "EASY_MEMORY_REPORT-CN.md", "WORKFLOW.md", "WORKFLOW-CN.md", "XMAKE_INTEGRATION.md", "XMAKE_INTEGRATION-CN.md")
        Get-ChildItem -Path docs -Filter *.md | Where-Object { $DocExcludes -notcontains $_.Name } | ForEach-Object {
          Copy-Item $_.FullName $dist
        }
        # LuaCATS type annotations
        Copy-Item -Recurse types (Join-Path $dist "types")
        Compress-Archive -Path (Join-Path $dist "*") -DestinationPath lunet-windows-amd64.zip -Force

    - name: Package release SDK (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $sdk = Join-Path $env:RUNNER_TEMP ("lunet-sdk-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
        New-Item -ItemType Directory -Path (Join-Path $sdk "bin"), (Join-Path $sdk "examples\sdk_embed\app"), (Join-Path $sdk "include"), (Join-Path $sdk "lib") -Force | Out-Null
        Copy-Item (Get-ChildItem -Path build -Recurse -Filter lunet-static.lib | Select-Object -First 1).FullName (Join-Path $sdk "lib\lunet-static.lib")
        Copy-Item include\lunet.h, include\lunet_exports.h (Join-Path $sdk "include")
        Copy-Item bin\generate_embed_scripts.lua (Join-Path $sdk "bin")
        Copy-Item examples\sdk_embed\main.c (Join-Path $sdk "examples\sdk_embed")
        Copy-Item examples\sdk_embed\app\main.lua (Join-Path $sdk "examples\sdk_embed\app")
        Copy-Item docs\EMBEDDING.md (Join-Path $sdk "README.md")
        Copy-Item docs\EMBEDDING-CN.md (Join-Path $sdk "README-CN.md")
        Copy-Item LICENSE $sdk
        Compress-Archive -Path (Join-Path $sdk "*") -DestinationPath lunet-windows-amd64-sdk.zip -Force

    # Guard against shipping a broken archive: extract the just-built tarball
    # and exercise both Rust ext modules through the packaged binary, using
    # exactly the layout downstream apps will consume (#115).
    - name: Verify packaged ext modules (Unix)
      if: runner.os != 'Windows'
      run: |
        set -euo pipefail
        if [ "${{ matrix.platform }}" = "linux" ]; then
          ARCHIVE="lunet-linux-${{ matrix.arch }}.tar.gz"
        else
          ARCHIVE=lunet-macos.tar.gz
        fi
        VERIFY_DIR="$(mktemp -d)"
        tar -C "$VERIFY_DIR" -xzf "$ARCHIVE"
        cat > "$VERIFY_DIR/verify_ext.lua" <<LUA
        package.path = "$VERIFY_DIR/?.lua;" .. package.path
        local lnt = require("lunet.lnt_shared")
        local store = lnt.store("verify", 256 * 1024)
        assert(store:set("k", "v"))
        assert(store:get("k") == "v")
        local json = require("lunet.jsonic")
        local v = json.decode('{"a":1,"s":"ok"}')
        assert(v.a == 1 and v.s == "ok")
        assert(json.encode({ a = 1 }, { keyorder = { "a" } }) == '{"a":1}')
        print("VERIFY OK: lunet.lnt_shared + lunet.jsonic work from packaged archive")
        LUA
        "$VERIFY_DIR/lunet-run" "$VERIFY_DIR/verify_ext.lua"

    # Keep these steps byte-identical to the documented commands in
    # docs/EMBEDDING.md so CI verifies exactly what users are told to run.
    - name: Verify packaged SDK (Linux)
      if: matrix.platform == 'linux'
      run: |
        set -euo pipefail
        VERIFY_DIR="$(mktemp -d)"
        tar -C "$VERIFY_DIR" -xzf "lunet-linux-${{ matrix.arch }}-sdk.tar.gz"
        (
          cd "$VERIFY_DIR"
          mkdir generated
          LUNET_EMBED_SOURCE=examples/sdk_embed/app \
          LUNET_EMBED_OUTPUT=generated/lunet_embed_scripts_blob.h \
          LUNET_EMBED_PROJECT_ROOT="$VERIFY_DIR" \
          xmake lua bin/generate_embed_scripts.lua
          cc -std=c99 -Iinclude -Igenerated \
            $(pkg-config --cflags luajit libuv zlib) \
            examples/sdk_embed/main.c lib/liblunet-static.a \
            $(pkg-config --libs luajit libuv zlib) -pthread -ldl -lm \
            -o sdk-embedded-app
          timeout 10 ./sdk-embedded-app
        )

    - name: Verify packaged SDK (macOS)
      if: runner.os == 'macOS'
      run: |
        set -euo pipefail
        VERIFY_DIR="$(mktemp -d)"
        tar -C "$VERIFY_DIR" -xzf lunet-macos-sdk.tar.gz
        (
          cd "$VERIFY_DIR"
          mkdir generated
          LUNET_EMBED_SOURCE=examples/sdk_embed/app \
          LUNET_EMBED_OUTPUT=generated/lunet_embed_scripts_blob.h \
          LUNET_EMBED_PROJECT_ROOT="$VERIFY_DIR" \
          xmake lua bin/generate_embed_scripts.lua
          cc -std=c99 -Iinclude -Igenerated \
            $(pkg-config --cflags luajit libuv zlib) \
            examples/sdk_embed/main.c lib/liblunet-static.a \
            $(pkg-config --libs luajit libuv zlib) -o sdk-embedded-app
          if command -v gtimeout &>/dev/null; then TMO=gtimeout; else TMO=timeout; fi
          $TMO 10 ./sdk-embedded-app
        )

    - name: Verify packaged SDK (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $verify = Join-Path $env:RUNNER_TEMP ("lunet-sdk-verify-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
        Expand-Archive -Path lunet-windows-amd64-sdk.zip -DestinationPath $verify -Force
        Push-Location $verify
        try {
          New-Item -ItemType Directory generated | Out-Null
          $env:LUNET_EMBED_SOURCE = "examples\\sdk_embed\\app"
          $env:LUNET_EMBED_OUTPUT = "generated\\lunet_embed_scripts_blob.h"
          $env:LUNET_EMBED_PROJECT_ROOT = $verify
          xmake lua bin\generate_embed_scripts.lua
          if ($LASTEXITCODE -ne 0) { throw "SDK blob generation failed" }
          # /MD is required, not optional: lunet-static.lib is built against the
          # dynamic CRT, so its objects reference __imp_ CRT symbols, and the
          # vcpkg x64-windows triplet is dynamic too. Without /MD, cl defaults to
          # the static CRT and the link dies with LNK2019 on __imp__fullpath,
          # __imp_fopen, __imp_fwrite, __imp_realloc, __imp_strerror and
          # __imp__mkdir (preceded by a wall of LNK4217/LNK4286 "defined in
          # libucrt.lib ... is imported by" warnings, which are the tell).
          cl /nologo /std:c11 /MD /I include /I generated /I "$env:VCPKG_ROOT\installed\x64-windows\include" examples\sdk_embed\main.c lib\lunet-static.lib /link /LIBPATH:"$env:VCPKG_ROOT\installed\x64-windows\lib" lua51.lib uv.lib zlib.lib ws2_32.lib iphlpapi.lib userenv.lib psapi.lib advapi32.lib user32.lib shell32.lib ole32.lib dbghelp.lib /OUT:sdk-embedded-app.exe
          if ($LASTEXITCODE -ne 0) { throw "SDK example compile failed" }
          # /MD plus the dynamic vcpkg triplet means the exe loads lua51.dll,
          # uv.dll and zlib1.dll at runtime. They live in vcpkg's bin, not in
          # the SDK archive, so without this the process dies before main()
          # with STATUS_DLL_NOT_FOUND (0xC0000135) and prints nothing at all.
          $env:PATH = "$env:VCPKG_ROOT\installed\x64-windows\bin;$env:PATH"
          & .\sdk-embedded-app.exe
          $appExit = $LASTEXITCODE
          if ($appExit -ne 0) {
            # Report the code: a bare "execution failed" with no stdout is
            # indistinguishable from a loader failure, which cost a CI cycle.
            throw ("SDK example execution failed (exit code {0} / 0x{1:X8})" -f $appExit, $appExit)
          }
        } finally {
          Pop-Location
        }

    - name: Upload artifact (Linux)
      if: matrix.platform == 'linux'
      uses: actions/upload-artifact@v4
      with:
        name: lunet-linux-${{ matrix.arch }}
        path: |
          build/**/lunet-run
          build/**/lunet.so
          build/**/lunet/*.so

    - name: Upload artifact (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: lunet-macos
        path: |
          build/**/lunet-run
          build/**/lunet.so
          build/**/lunet/*.so

    - name: Upload artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: lunet-windows-amd64
        path: |
          build/**/lunet-run.exe
          build/**/lunet.dll
          build/**/lunet/*.dll

    - name: Upload release archive (Linux)
      if: matrix.platform == 'linux'
      uses: actions/upload-artifact@v4
      with:
        name: release-linux-${{ matrix.arch }}
        path: lunet-linux-${{ matrix.arch }}.tar.gz

    - name: Upload release archive (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: release-macos
        path: lunet-macos.tar.gz

    - name: Upload release archive (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: release-windows
        path: lunet-windows-amd64.zip

    - name: Upload release SDK (Linux)
      if: matrix.platform == 'linux'
      uses: actions/upload-artifact@v4
      with:
        name: release-sdk-linux-${{ matrix.arch }}
        path: lunet-linux-${{ matrix.arch }}-sdk.tar.gz

    - name: Upload release SDK (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: release-sdk-macos
        path: lunet-macos-sdk.tar.gz

    - name: Upload release SDK (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: release-sdk-windows
        path: lunet-windows-amd64-sdk.zip

  embed-scripts:
    name: Embed scripts smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, macos-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

    - name: Install xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: "3.0.8"

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: bash contributing/deps/debian.sh --ci

    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        bash contributing/deps/macos.sh
        echo "PKG_CONFIG_PATH=$(brew --prefix zlib)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

    - name: Configure embed scripts build
      run: xmake f -c -m release --lunet_embed_scripts=y --lunet_embed_scripts_dir=examples -y

    - name: Build embedded lunet-run
      run: xmake build lunet-bin

    - name: Verify generated embed header
      shell: bash
      run: test -f .tmp/generated/lunet_embed_scripts_blob.h

  easy-memory:
    name: EasyMem QA (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, blacksmith-4vcpu-windows-2025]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          vcpkg/installed
          vcpkg/packages
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('xmake.lua') }}-${{ hashFiles('vcpkg.json', 'ports/*/vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Install xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: "3.0.8"

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: bash contributing/deps/debian.sh --ci

    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        bash contributing/deps/macos.sh
        echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:$(brew --prefix mysql-client)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

    - name: Setup vcpkg (Windows)
      if: runner.os == 'Windows'
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '66c0373dc7fca549e5803087b9487edfe3aca0a1'
      env:
        VCPKG_BINARY_SOURCES: 'clear;nuget,readwrite'

    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: pwsh contributing/deps/windows.ps1

    - name: Configure EasyMem + ASAN (Unix)
      if: runner.os != 'Windows'
      run: xmake f -c -m debug --lunet_trace=y --lunet_verbose_trace=n --asan=y --easy_memory=y -y

    - name: Configure EasyMem + ASAN (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $env:VCPKG_ROOT = "${{ github.workspace }}/vcpkg"
        $env:VCPKG_DEFAULT_TRIPLET = "x64-windows"
        $env:CL = "/MP"
        $env:CI = "true"
        xmake f -c -m debug --lunet_trace=y --lunet_verbose_trace=n --asan=y --easy_memory=y -y

    - name: Build Core + DB Drivers (EasyMem + ASAN)
      if: runner.os != 'Windows'
      run: |
        xmake build lunet-bin
        xmake build lunet-sqlite3
        xmake build lunet-mysql
        xmake build lunet-postgres

    - name: Build Core + SQLite Driver (EasyMem + ASAN, Windows)
      if: runner.os == 'Windows'
      run: |
        xmake build lunet-bin
        xmake build lunet-sqlite3

    - name: Run light DB stress (Unix)
      if: runner.os != 'Windows'
      run: |
        LUNET_BIN=$(find build -name 'lunet-run' -type f | head -1)
        if command -v gtimeout &>/dev/null; then TMO=gtimeout; else TMO=timeout; fi
        $TMO 60 env ASAN_OPTIONS=detect_leaks=0 LIGHT_DB_STRESS_OPS=20 "$LUNET_BIN" test/ci_easy_memory_db_stress.lua

    - name: LSAN regression (Unix)
      if: runner.os != 'Windows'
      run: |
        LUNET_BIN=$(find build -name 'lunet-run' -type f | head -1)
        if command -v gtimeout &>/dev/null; then TMO=gtimeout; else TMO=timeout; fi
        # Run with LSAN leak detection ON.  exitcode=23 lets us distinguish
        # "leaks detected" from "crash".  The MySQL C++ runtime has a known
        # fixed overhead of ~4 allocations that do not grow with usage.
        set +e
        LSAN_OPTIONS=exitcode=23 LSAN_STRESS_ITERATIONS=10 \
          $TMO 60 "$LUNET_BIN" test/ci_easy_memory_lsan_regression.lua 2>lsan_stderr.txt
        rc=$?
        set -e
        cat lsan_stderr.txt >&2
        if [ $rc -eq 0 ]; then
          echo "LSAN: clean — no leaks detected"
        elif [ $rc -eq 23 ]; then
          allocs=$(grep -oE '[0-9]+ allocation' lsan_stderr.txt | tail -1 | grep -oE '[0-9]+')
          echo "LSAN: $allocs allocation(s) leaked"
          if [ -n "$allocs" ] && [ "$allocs" -eq 4 ]; then
            echo "LSAN: known fixed MySQL C++ runtime overhead confirmed (exactly 4 allocations)"
          else
            echo "LSAN: unexpected allocation count (expected exactly 4 when leaks are reported)"
            exit 1
          fi
        else
          echo "LSAN: process failed with exit code $rc"
          exit $rc
        fi

    - name: Run light DB stress (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Add MSVC ASAN runtime DLL directory to PATH
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath 2>$null
        if ($vsPath) {
          $asanDirs = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Recurse -Filter "clang_rt.asan_dynamic-x86_64.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { $_.DirectoryName } | Select-Object -Unique
          foreach ($dir in $asanDirs) {
            Write-Host "Adding ASAN runtime dir to PATH: $dir"
            $env:PATH = "$dir;$env:PATH"
          }
        }
        $lunet = Get-ChildItem -Path build -Recurse -Filter "lunet-run.exe" | Select-Object -First 1
        if (-not $lunet) { throw "lunet-run.exe not found" }
        Write-Host "Binary: $($lunet.FullName)"
        $env:LIGHT_DB_STRESS_OPS = "20"
        & $lunet.FullName test/ci_easy_memory_db_stress.lua 2>&1
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::error::DB stress test failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }

  lua-qa:
    name: Lua QA (luacheck + C lint)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: "3.0.8"
    - name: Install QA deps
      run: |
        bash contributing/deps/debian.sh --ci --qa-only
    - name: xmake lint
      run: xmake lint
    - name: xmake check
      run: xmake check
    - name: xmake check-types
      run: xmake check-types

  publish-release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.ref, 'v'))
    needs: [build, embed-scripts, easy-memory, lua-qa]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}
        fetch-depth: 0  # full tag history for per-tag release notes

    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: "3.0.8"

    - name: Download release archives
      uses: actions/download-artifact@v4
      with:
        pattern: release-*
        merge-multiple: true
        path: release-assets

    - name: Generate release notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        LUNET_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref_name }}
      run: |
        xmake lua bin/generate_release_notes.lua
        cat release-notes.md

    - name: Render fetch-release helper
      env:
        LUNET_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref_name }}
      run: |
        sed "s/@RELEASE_TAG@/${LUNET_RELEASE_TAG}/g" bin/lunet_fetch_release.lua > "release-assets/lunet_fetch_release_${LUNET_RELEASE_TAG}.lua"
        ! grep -q '@RELEASE_TAG@' "release-assets/lunet_fetch_release_${LUNET_RELEASE_TAG}.lua"

    - name: Create or update GitHub release
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref_name }}
        body_path: release-notes.md
        files: |
          release-assets/lunet-linux-amd64.tar.gz
          release-assets/lunet-linux-arm64.tar.gz
          release-assets/lunet-macos.tar.gz
          release-assets/lunet-windows-amd64.zip
          release-assets/lunet-linux-amd64-sdk.tar.gz
          release-assets/lunet-linux-arm64-sdk.tar.gz
          release-assets/lunet-macos-sdk.tar.gz
          release-assets/lunet-windows-amd64-sdk.zip
          release-assets/lunet_fetch_release_${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref_name }}.lua
