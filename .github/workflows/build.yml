  embed-scripts:
    name: Embed scripts smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, macos-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

    - name: Install xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: "3.0.8"

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: bash contributing/deps/debian.sh --ci

    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        bash contributing/deps/macos.sh
        echo "PKG_CONFIG_PATH=$(brew --prefix zlib)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

    - name: Configure embed scripts build
      run: xmake f -c -m release --lunet_embed_scripts=y --lunet_embed_scripts_dir=examples -y

    - name: Build embedded lunet-run
      run: xmake build lunet-bin

    - name: Verify generated embed header
      shell: bash
      run: test -f .tmp/generated/lunet_embed_scripts_blob.h

  easy-memory:
    name: EasyMem QA (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, blacksmith-4vcpu-windows-2025]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          vcpkg/installed
          vcpkg/packages
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('xmake.lua') }}-${{ hashFiles('vcpkg.json', 'ports/*/vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Install xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: "3.0.8"

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: bash contributing/deps/debian.sh --ci

    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        bash contributing/deps/macos.sh
        echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:$(brew --prefix mysql-client)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

    - name: Setup vcpkg (Windows)
      if: runner.os == 'Windows'
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '66c0373dc7fca549e5803087b9487edfe3aca0a1'
      env:
        VCPKG_BINARY_SOURCES: 'clear;nuget,readwrite'

    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: pwsh contributing/deps/windows.ps1

    - name: Configure EasyMem + ASAN (Unix)
      if: runner.os != 'Windows'
      run: xmake f -c -m debug --lunet_trace=y --lunet_verbose_trace=n --asan=y --easy_memory=y -y

    - name: Configure EasyMem + ASAN (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $env:VCPKG_ROOT = "${{ github.workspace }}/vcpkg"
        $env:VCPKG_DEFAULT_TRIPLET = "x64-windows"
        $env:CL = "/MP"
        $env:CI = "true"
        xmake f -c -m debug --lunet_trace=y --lunet_verbose_trace=n --asan=y --easy_memory=y -y

    - name: Build Core + DB Drivers (EasyMem + ASAN)
      if: runner.os != 'Windows'
      run: |
        xmake build lunet-bin
        xmake build lunet-sqlite3
        xmake build lunet-mysql
        xmake build lunet-postgres

    - name: Build Core + SQLite Driver (EasyMem + ASAN, Windows)
      if: runner.os == 'Windows'
      run: |
        xmake build lunet-bin
        xmake build lunet-sqlite3

    - name: Run light DB stress (Unix)
      if: runner.os != 'Windows'
      run: |
        LUNET_BIN=$(find build -name 'lunet-run' -type f | head -1)
        if command -v gtimeout &>/dev/null; then TMO=gtimeout; else TMO=timeout; fi
        $TMO 60 env ASAN_OPTIONS=detect_leaks=0 LIGHT_DB_STRESS_OPS=20 "$LUNET_BIN" test/ci_easy_memory_db_stress.lua

    - name: LSAN regression (Unix)
      if: runner.os != 'Windows'
      run: |
        LUNET_BIN=$(find build -name 'lunet-run' -type f | head -1)
        if command -v gtimeout &>/dev/null; then TMO=gtimeout; else TMO=timeout; fi
        # Run with LSAN leak detection ON.  exitcode=23 lets us distinguish
        # "leaks detected" from "crash".  The MySQL C++ runtime has a known
        # fixed overhead of ~4 allocations that do not grow with usage.
        set +e
        LSAN_OPTIONS=exitcode=23 LSAN_STRESS_ITERATIONS=10 \
          $TMO 60 "$LUNET_BIN" test/ci_easy_memory_lsan_regression.lua 2>lsan_stderr.txt
        rc=$?
        set -e
        cat lsan_stderr.txt >&2
        if [ $rc -eq 0 ]; then
          echo "LSAN: clean — no leaks detected"
        elif [ $rc -eq 23 ]; then
          allocs=$(grep -oE '[0-9]+ allocation' lsan_stderr.txt | tail -1 | grep -oE '[0-9]+')
          echo "LSAN: $allocs allocation(s) leaked"
          if [ -n "$allocs" ] && [ "$allocs" -eq 4 ]; then
            echo "LSAN: known fixed MySQL C++ runtime overhead confirmed (exactly 4 allocations)"
          else
            echo "LSAN: unexpected allocation count (expected exactly 4 when leaks are reported)"
            exit 1
          fi
        else
          echo "LSAN: process failed with exit code $rc"
          exit $rc
        fi

    - name: Run light DB stress (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Add MSVC ASAN runtime DLL directory to PATH
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath 2>$null
        if ($vsPath) {
          $asanDirs = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Recurse -Filter "clang_rt.asan_dynamic-x86_64.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { $_.DirectoryName } | Select-Object -Unique
          foreach ($dir in $asanDirs) {
            Write-Host "Adding ASAN runtime dir to PATH: $dir"
            $env:PATH = "$dir;$env:PATH"
          }
        }
        $lunet = Get-ChildItem -Path build -Recurse -Filter "lunet-run.exe" | Select-Object -First 1
        if (-not $lunet) { throw "lunet-run.exe not found" }
        Write-Host "Binary: $($lunet.FullName)"
        $env:LIGHT_DB_STRESS_OPS = "20"
        & $lunet.FullName test/ci_easy_memory_db_stress.lua 2>&1
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::error::DB stress test failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }

  lua-qa:
    name: Lua QA (luacheck + C lint)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: "3.0.8"
    - name: Install QA deps
      run: |
        bash contributing/deps/debian.sh --ci --qa-only
    - name: xmake lint
      run: xmake lint
    - name: xmake check
      run: xmake check

  # MySQL driver integration test — Linux-only, release builds only.
  #
  # This job validates the MySQL driver against a live database server. It runs
  # only for release builds (version tags or manual dispatch with a version tag
  # ref), not on every push or pull request. The reason is cost: pulling a MySQL
  # image and waiting for it to become healthy adds meaningful wall-clock time
  # to the most frequently executed job in the repository, on every single run,
  # for a driver that most changes do not touch. Branch protection already
  # requires `build` across all three platforms with `strict` set, so slowing it
  # slows every merge.
  #
  # The consequence to accept deliberately: driver defects will be caught at tag
  # time rather than at pull-request time. A green pull request must not be read
  # as driver validation — that happens only at release time.
  #
  # This job is deliberately NOT added to the required status checks on main,
  # for the same reason `publish-release` is excluded: a check that is skipped
  # on non-tag pushes, if required, deadlocks every merge (documented in
  # AGENTS.md).
  #
  # Server image: MySQL 8.4 (LTS). MariaDB presents the same client API but has
  # differed in client header details (see item19 is_null fix); testing against
  # MySQL does not validate MariaDB, and vice versa. MySQL 8.4 is chosen as the
  # primary target.
  mysql-integration:
    name: MySQL integration (release builds only)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.ref, 'v'))
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      LUNET_MYSQL_HOST: 127.0.0.1
      LUNET_MYSQL_PORT: 3306
      LUNET_MYSQL_USER: root
      LUNET_MYSQL_PASSWORD: root
      LUNET_MYSQL_DATABASE: test
      LUNET_DB_REQUIRED: "1"
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

    - name: Install xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: "3.0.8"

    - name: Install Dependencies
      run: bash contributing/deps/debian.sh --ci

    - name: Configure
      run: xmake f -m release -y

    - name: Build MySQL driver
      run: |
        xmake build lunet-bin
        xmake build lunet-mysql
        if [ ! -f "$(find build -type f -name 'mysql.so' | head -n 1)" ]; then
          echo "ERROR: lunet-mysql driver module not found after build" >&2
          exit 1
        fi

    - name: Wait for MySQL readiness
      run: |
        set -euo pipefail
        echo "Waiting for MySQL to accept connections..."
        for i in $(seq 1 30); do
          if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent 2>/dev/null; then
            echo "MySQL is ready"
            exit 0
          fi
          echo "Attempt $i/30: MySQL not ready yet, waiting 2s..."
          sleep 2
        done
        echo "ERROR: MySQL did not become ready within 60s" >&2
        exit 1

    - name: Run MySQL smoke tests
      run: |
        LUNET_BIN=$(find build -name 'lunet-run' -type f | head -1)
        if [ -z "$LUNET_BIN" ]; then
          echo "ERROR: lunet-run not found" >&2
          exit 1
        fi
        echo "Running test/smoke_mysql.lua (item17 parameterised, item18 mismatch, item19 NULL, item19a metadata, item19e boolean)..."
        "$LUNET_BIN" test/smoke_mysql.lua

  # Postgres driver integration test — Linux-only, release builds only.
  #
  # Same rationale as mysql-integration: cost of pulling a Postgres image and
  # waiting for readiness on every push/PR is not justified for a driver most
  # changes do not touch. Driver validation happens at tag time, not PR time.
  #
  # This job is deliberately NOT added to the required status checks on main,
  # for the same reason publish-release and mysql-integration are excluded: a
  # check that is skipped on non-tag pushes, if required, deadlocks every merge
  # (documented in AGENTS.md).
  #
  # Server image: PostgreSQL 16 (current stable). The Postgres driver uses
  # libpq, which is compatible with both PostgreSQL and compatible servers
  # (CockroachDB, etc.), but testing against PostgreSQL does not validate
  # those alternatives.
  #
  # Postgres readiness differs from MySQL's: the server accepts connections
  # briefly during initialisation before the target database exists. The probe
  # must confirm the actual target database is connectable, not merely that a
  # server is listening.
  postgres-integration:
    name: Postgres integration (release builds only)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.ref, 'v'))
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      LUNET_POSTGRES_HOST: 127.0.0.1
      LUNET_POSTGRES_PORT: 5432
      LUNET_POSTGRES_USER: postgres
      LUNET_POSTGRES_PASSWORD: postgres
      LUNET_POSTGRES_DATABASE: test
      LUNET_DB_REQUIRED: "1"
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

    - name: Install xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: "3.0.8"

    - name: Install Dependencies
      run: bash contributing/deps/debian.sh --ci

    - name: Configure
      run: xmake f -m release -y

    - name: Build Postgres driver
      run: |
        xmake build lunet-bin
        xmake build lunet-postgres
        if [ ! -f "$(find build -type f -name 'postgres.so' | head -n 1)" ]; then
          echo "ERROR: lunet-postgres driver module not found after build" >&2
          exit 1
        fi

    - name: Wait for Postgres readiness
      run: |
        set -euo pipefail
        echo "Waiting for Postgres to accept connections on target database..."
        for i in $(seq 1 30); do
          if pg_isready -h 127.0.0.1 -p 5432 -U postgres -d test 2>/dev/null; then
            echo "Postgres is ready"
            exit 0
          fi
          echo "Attempt $i/30: Postgres not ready yet, waiting 2s..."
          sleep 2
        done
        echo "ERROR: Postgres did not become ready within 60s" >&2
        exit 1

    - name: Run Postgres smoke tests
      run: |
        LUNET_BIN=$(find build -name 'lunet-run' -type f | head -1)
        if [ -z "$LUNET_BIN" ]; then
          echo "ERROR: lunet-run not found" >&2
          exit 1
        fi
        echo "Running test/smoke_postgres.lua (parameterised queries with \$n placeholders, NULL, boolean item19e, mixed types)..."
        "$LUNET_BIN" test/smoke_postgres.lua

  publish-release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.ref, 'v'))
    needs: [build, embed-scripts, easy-memory, lua-qa]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}
        fetch-depth: 0  # full tag history for per-tag release notes

    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: "3.0.8"

    - name: Download release archives
      uses: actions/download-artifact@v4
      with:
        pattern: release-*
        merge-multiple: true
        path: release-assets

    - name: Generate release notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        LUNET_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref_name }}
      run: |
        xmake lua bin/generate_release_notes.lua
        cat release-notes.md

    - name: Create or update GitHub release
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref_name }}
        body_path: release-notes.md
        files: |
          release-assets/lunet-linux-amd64.tar.gz
          release-assets/lunet-linux-arm64.tar.gz
          release-assets/lunet-macos.tar.gz
          release-assets/lunet-windows-amd64.zip
          release-assets/lunet-linux-amd64-sdk.tar.gz
          release-assets/lunet-linux-arm64-sdk.tar.gz
          release-assets/lunet-macos-sdk.tar.gz
          release-assets/lunet-windows-amd64-sdk.zip
