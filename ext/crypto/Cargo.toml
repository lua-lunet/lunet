[package]
name = "lunet-crypto"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = []

[lib]
name = "lunet_crypto"
crate-type = ["cdylib"]

# Zero dependencies: libsodium is linked by build.rs (static archive),
# reached through extern "C" declarations in src/lib.rs.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
