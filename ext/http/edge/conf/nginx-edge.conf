# Edge example: nginx as the security edge in front of the realworld app.
# This mirrors the worked settings block in ext/http/README.md. The settings
# are an illustration, not a recommendation: read the current nginx
# documentation for the release you deploy.
#
# nginx is the reference edge in the base image: full-request buffering is
# its default (proxy_request_buffering on; stated explicitly below so
# nobody silently loses it), so a pathological drip-feed client is absorbed
# here and lunet never sees it.

worker_processes 1;
pid /run/nginx-edge.pid;
error_log /var/log/nginx/edge-error.log warn;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/edge-access.log;

    # The upstream is the app on loopback, inside the same container
    # namespace. Nothing external can reach it: only this edge listens on
    # the container's external interface.
    upstream lunet_app {
        server 127.0.0.1:8081;
        keepalive 16;
    }

    server {
        listen 80;

        # nginx default since 1.19.10, stated to pin it.
        keepalive_requests 1000;

        # nginx default (4 x 8k = 32 KiB header section), stated explicitly:
        # it matches MAX_HEADER_BYTES in ext/http/http_caps.lua, so this edge
        # answers first (400/414) and lunet's cap stays a backstop.
        large_client_header_buffers 4 8k;

        # nginx default (1m), stated explicitly: matches MAX_BODY_BYTES in
        # ext/http/http_caps.lua; oversize answers 413 here and the body
        # never reaches lunet.
        client_max_body_size 1m;

        # nginx default: the entire request body is read from the client
        # before anything is sent upstream. Stated on purpose: this is the
        # behaviour that absorbs drip-fed and fragmented requests.
        proxy_request_buffering on;

        # Tightened from the 60s defaults so a dribbling client is cut
        # quickly: headers in 10s, body reads in 10s.
        client_header_timeout 10s;
        client_body_timeout 10s;

        keepalive_timeout 65;

        location / {
            proxy_pass http://lunet_app;
            proxy_http_version 1.1;   # the default since nginx 1.29.7; stated to be version-proof
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
