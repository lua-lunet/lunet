# Edge example: OpenResty as the security edge in front of the realworld app.
# Same lineage and same directive semantics as nginx (OpenResty bundles
# nginx); the security-oriented settings match conf/nginx-edge.conf. The
# scripting doors (Lua at the edge) are why an operator might pick it.
# Illustration, not a recommendation: read the current documentation.

worker_processes 1;
pid /run/openresty-edge.pid;
error_log /usr/local/openresty/nginx/logs/edge-error.log warn;

events {
    worker_connections 1024;
}

http {
    access_log /usr/local/openresty/nginx/logs/edge-access.log;

    upstream lunet_app {
        server 127.0.0.1:8081;
        keepalive 16;
    }

    server {
        listen 80;

        keepalive_requests 1000;            # nginx default since 1.19.10 - stated to pin it
        large_client_header_buffers 4 8k;   # nginx default, stated explicitly: 32 KiB header
                                            # section = MAX_HEADER_BYTES default
        client_max_body_size 1m;            # nginx default, stated explicitly: = MAX_BODY_BYTES
                                            # default; oversize answers 413 here
        proxy_request_buffering on;         # nginx default: buffer the entire request body
                                            # before forwarding - absorbs drip-fed requests
        client_header_timeout 10s;          # tightened from 60s: dribbling clients are cut
        client_body_timeout 10s;            # tightened from 60s
        keepalive_timeout 65;

        location / {
            proxy_pass http://lunet_app;
            proxy_http_version 1.1;   # the default since nginx 1.29.7 - stated to be version-proof
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
