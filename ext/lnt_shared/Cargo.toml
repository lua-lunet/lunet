[package]
name = "lnt-shared"
version = "0.1.0"
edition = "2024"
description = """
lunet-style shared dictionary for LuaJIT via FFI (Linux/macOS).
This is a lunet-native shared dictionary extension.
"""
license = "MIT"
authors = []

[lib]
name = "lnt_shared"
crate-type = ["cdylib"]

# Minimal dependencies — only libc for raw OS primitives (mmap, clock_gettime).
# No allocator crates, no async runtimes, no heavy frameworks.
[dependencies]
libc = { version = "0.2", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Never unwind through an FFI boundary.
panic = "abort"
strip = "symbols"
