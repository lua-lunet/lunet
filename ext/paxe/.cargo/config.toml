# Cargo reads configuration from the current working directory upward, so
# this file applies when cargo runs with ext/paxe as its cwd — which the
# xmake build-paxe/test-paxe tasks and the CI steps all do (the same cwd
# requirement rust-toolchain.toml already imposes).
#
# git-fetch-with-cli: paxe-core is a private repository fetched over ssh.
# Cargo's built-in libgit2 transport finds no credentials for it (no
# ssh-agent interop, no insteadOf rewriting); the git CLI uses the
# developer's ordinary ssh setup and honours the url.insteadOf rewrite
# the CI step installs for its token-authenticated https fetch.
[net]
git-fetch-with-cli = true
