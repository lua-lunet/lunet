[package]
name = "lunet-paxe"
version = "0.1.0"
# Edition 2021, deliberately not 2024: this crate needs nothing from the
# newer edition, and 2021 keeps the toolchain floor low and the unsafe
# attribute syntax simple (#[no_mangle], not #[unsafe(no_mangle)]). Matches
# the conservative toolchain pin in rust-toolchain.toml and paxe-core's own
# edition, so the two never disagree.
edition = "2021"
description = """
PAXE datagram encryption for lunet: the C ABI that lunet.paxe binds to over
the LuaJIT FFI. The protocol lives in paxe-core; this crate is the boundary
and the cdylib. Pure opt-in extension - not linked into lunet-run.
"""
license = "MIT"
authors = []

[lib]
name = "lunet_paxe"
crate-type = ["cdylib"]

# DEPENDENCY POLICY: paxe-core and nothing else. Not libc, not zeroize, not
# secrecy, not a crypto crate. All cryptography and all secure-memory
# handling come from libsodium via paxe-core's extern "C" declarations,
# statically linked by ITS build.rs - which is why this crate no longer has
# one; cargo propagates the core's link directives to this cdylib's link.
#
# paxe-core is VENDORED at paxe-core/ (byte-exact from the upstream release
# tag; see paxe-core.version beside this file for the tag/commit/archive
# digest). Vendored, not a git dependency: the upstream repository is
# private, and a git fetch needs credentials that CI runners, the docker
# gate and arbitrary developer machines do not all have. A path dependency
# builds everywhere with zero network. Re-vendor on a bump with
# `xmake vendor-paxe` (needs read access to the upstream repo), which
# rewrites the tree and the manifest in one reviewable commit.
#
# default-features = false: paxe-core's "ffi" feature exports its own
# lunet_paxe_* symbols, which would collide with this crate's at link time.
# This crate IS the lunet-facing ABI (see src/lib.rs for why the ABI is
# owned here rather than re-exported from the dependency).
[dependencies]
paxe = { package = "paxe-core", path = "paxe-core", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Never unwind through an FFI boundary: unwinding into the LuaJIT host is
# undefined behaviour, and with panic = "abort" a panic kills the whole
# host process. The resulting no-panic-on-any-input constraint is a hard
# design rule, enforced in paxe-core.
panic = "abort"
strip = "symbols"
