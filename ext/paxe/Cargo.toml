[package]
name = "lunet-paxe"
version = "0.1.0"
# Edition 2021, deliberately not 2024: this crate has zero dependencies and
# needs nothing from the newer edition, and 2021 keeps the toolchain floor
# low and the unsafe-attribute syntax simple (#[no_mangle], not
# #[unsafe(no_mangle)]). Matches the conservative toolchain pin in
# rust-toolchain.toml.
edition = "2021"
description = """
PAXE datagram encryption for lunet (Rust rewrite replacing the deleted
src/paxe.c). cdylib loaded at runtime by lunet.paxe via the LuaJIT FFI.
Pure opt-in extension - not linked into lunet-run.
"""
license = "MIT"
authors = []

[lib]
name = "lunet_paxe"
crate-type = ["cdylib"]

# DEPENDENCY POLICY: zero crates. Not libc, not zeroize, not secrecy, not a
# crypto crate. All cryptography AND all secure-memory handling come from
# libsodium via extern "C" declarations (item02), statically linked into
# this cdylib (owner decision): sodium_malloc/sodium_mlock/sodium_memzero
# give guarded, locked, reliably-zeroed key storage, and the project already
# requires and links libsodium for this module. This section stays empty by
# decision, not by accident - do not add entries without owner sign-off.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Never unwind through an FFI boundary: unwinding into the LuaJIT host is
# undefined behaviour, and with panic = "abort" a panic kills the whole
# host process. The resulting no-panic-on-any-input constraint is a hard
# design rule documented in src/lib.rs.
panic = "abort"
strip = "symbols"
